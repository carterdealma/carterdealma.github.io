<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird of the Day</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Preconnect to eBird domains (for map to load faster) -->
    <link rel="preconnect" href="https://ebird.org">
    <link rel="preconnect" href="https://embed.ebird.org">
    <link rel="dns-prefetch" href="https://ebird.org">
    <link rel="dns-prefetch" href="https://embed.ebird.org">
</head>
<body class="bird-page">
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" aria-label="Primary">
            <a href="index.html" class="sidebar-link">
                <img src="icons/about-me-icon.png" class="icon" alt="About Me icon">
                <span class="label">About Me</span>
            </a>
            <a href="bird-of-the-day.html" class="sidebar-link" aria-current="page">
                <img src="icons/bird-icon.png" class="icon" alt="Bird icon">
                <span class="label">Bird of the Day</span>
            </a>
        </nav>
    </aside>

    <main class="page-content">
        <section class="panel bird-panel" aria-labelledby="bird_name">
            <header class="bird-header">
                <h1 class="bird-heading">
                    <span id="bird_title" class="bird-title-prefix" aria-live="polite"></span>
                    <span id="bird_name" class="bird-title-name"></span>
                </h1>
                <p id="bird_scientific_name" class="bird-scientific-name"></p>
            </header>

            <div class="bird-info">
                <section class="bird-detail" aria-label="Bird photo and description">
                    <figure class="bird-figure">
                        <img id="bird_photo" class="bird-photo" alt="Photo of bird">
                        <p id="image_credit" class="image-credit"></p>
                    </figure>
                    <p id="bird_description"></p>
                </section>

                <section class="bird-detail" aria-label="Bird range map and range description">
                    <iframe id="bird_map" class="bird-map" loading="lazy" title="Bird range map"></iframe>
                    <p id="range_description"></p>
                </section>
            </div>

            <div class="button-container">
                <button id="back_button" type="button">&larr; Bird of the Day</button>
                <div class="button-with-loader">
                    <button id="new_bird_button" type="button">Spot a new bird!</button>
                    <span id="loader" class="loader" aria-hidden="true"></span>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="scripts/bird_script.js" defer></script>
    <script src="scripts/sidebar.js" defer></script>
</body>
</html>
